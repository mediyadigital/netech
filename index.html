<style>
/* Default (Dark) Theme */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#05060d;--bg2:#141a33;--glass:rgba(255,255,255,.07);--bd:rgba(255,255,255,.16);--tx:#f4f6ff;--mu:#a9b0cc;--ac:#ffd60a;--sh:0 8px 32px rgba(0,0,0,.4)}

/* Light Theme */
:root[data-theme="light"]{--bg1:#eef1fb;--bg2:#dfe5fa;--glass:rgba(255,255,255,.55);--bd:rgba(255,255,255,.9);--tx:#12152b;--mu:#4d5575;--ac:#ff9f0a;--sh:0 8px 32px rgba(40,50,110,.15)}

/* Ocean Theme */
:root[data-theme="ocean"]{--bg1:#041c32;--bg2:#064663;--glass:rgba(255,255,255,.05);--bd:rgba(255,255,255,.12);--tx:#ecf0f1;--mu:#b2bec3;--ac:#00d2d3;--sh:0 8px 32px rgba(0,0,0,.4)}

/* Nature (Green) Theme */
:root[data-theme="nature"]{--bg1:#112a20;--bg2:#1d593d;--glass:rgba(255,255,255,.06);--bd:rgba(255,255,255,.15);--tx:#e8f8f5;--mu:#a2d9ce;--ac:#2ecc71;--sh:0 8px 32px rgba(0,0,0,.4)}

*,*:before,*:after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh;overflow-x:hidden; transition: background 0.5s, color 0.5s;}

/* Background Orbs & Animation */
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.o1{width:380px;height:380px;background:#ffd60a;top:-80px;left:-80px;opacity:.25}.o2{width:420px;height:420px;background:#4f6bff;bottom:-100px;right:-100px}.o3{width:260px;height:260px;background:#ff3d9a;top:45%;left:50%;opacity:.2}
@keyframes fl{to{transform:translate(40px,60px) scale(1.15)}}

.glass{background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:var(--sh);border-radius:22px; transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:10px auto;max-width:1200px;width:calc(100% - 20px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-radius:999px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;letter-spacing:1px;text-decoration:none;color:var(--tx)}
.brand svg{width:40px;height:40px}
.nl{display:flex;gap:18px}.nl a{color:var(--mu);text-decoration:none;font-weight:600;font-size:.95rem; transition: color 0.3s;}.nl a:hover{color:var(--ac)}
.ctl{display:flex;gap:8px; align-items:center;}

/* ستايڵی هەلبژارتنا زمانان */
#lang-select {
    background: var(--glass);
    color: var(--tx);
    border: 1px solid var(--bd);
    padding: 6px 12px;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    outline: none;
    transition: 0.3s;
}
#lang-select:focus { border-color: var(--ac); }
#lang-select option { background: var(--bg2); color: var(--tx); font-weight: bold; }

.ctl button{border:1px solid var(--bd);background:var(--glass);color:var(--tx);padding:6px 11px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.9rem; transition: 0.3s; flex-shrink: 0;}
.ctl button:hover{border-color:var(--ac); color:var(--ac);}

main{max-width:1200px;margin:0 auto;padding:0 14px 40px}
.hero{text-align:center;padding:56px 18px;margin-top:14px; animation: slideDownFade 0.8s ease-out;}
.hero svg{width:110px;height:110px;filter:drop-shadow(0 0 28px rgba(255,214,10,.5))}
.hero h1{font-size:clamp(2rem,6vw,3.8rem);margin:12px 0 6px;line-height:1.15}
.hero h1 span{background:linear-gradient(90deg,var(--ac),#ff9f0a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:640px;margin:0 auto 22px;color:var(--mu);font-size:1.05rem;line-height:1.8}
.btn{display:inline-block;padding:12px 26px;border-radius:999px;background:var(--ac);color:#111;font-weight:800;text-decoration:none;margin:4px;border:0;cursor:pointer;font-size:1rem; transition: transform 0.3s;}
.btn:hover{transform: translateY(-3px);}
.btn.g{background:var(--glass);color:var(--tx);border:1px solid var(--bd)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0; animation: slideUpFade 0.8s ease-out;}
.stats div{padding:18px;text-align:center; transition: transform 0.3s;}
.stats div:hover{transform: translateY(-5px);}
.stats b{display:block;font-size:1.9rem;color:var(--ac)}.stats small{color:var(--mu)}
h2{font-size:clamp(1.5rem,4vw,2.2rem);margin:46px 0 14px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;margin-bottom:16px}
.tools input{flex:1;min-width:180px;padding:11px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--glass);color:var(--tx);font-size:1rem;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--glass);color:var(--tx);cursor:pointer;font-weight:600;font-size:.88rem; transition: 0.3s;}
.chip.on{background:var(--ac);color:#111;border-color:var(--ac)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .3s, border-color .3s, box-shadow .3s;}
.card:hover{transform:translateY(-8px);border-color:var(--ac); box-shadow: 0 15px 35px rgba(0,0,0,0.5);}
.ic{font-size:2.4rem;height:70px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:linear-gradient(135deg,rgba(255,214,10,.2),rgba(79,107,255,.2))}
.card h3{margin:4px 0 0;font-size:1.02rem;direction:ltr;text-align:start}
.tag{font-size:.75rem;color:var(--ac);font-weight:700}
.sp{color:var(--mu);font-size:.85rem;line-height:1.6;direction:ltr;text-align:start;flex:1}
.pr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.pr b{font-size:1.4rem;color:var(--ac)}

/* Add to Cart Button */
.pr button.add-cart{padding:7px 14px;border-radius:999px;background:var(--ac);color:#111;font-weight:700;font-size:.82rem;border:none;cursor:pointer;transition:transform 0.2s, background 0.3s;}
.pr button.add-cart:hover{transform:scale(1.06);}
.pr button.add-cart:disabled{background:var(--mu);cursor:not-allowed;transform:none;opacity:0.6;}

.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ct a{padding:22px;text-align:center;text-decoration:none;color:var(--tx);font-weight:700; transition: transform 0.3s, border-color 0.3s;}
.ct a:hover{transform: translateY(-5px); border-color:var(--ac);}
.ct a span{display:block;font-size:2rem;margin-bottom:6px}.ct small{display:block;color:var(--mu);font-weight:500;margin-top:4px;direction:ltr}

footer{text-align:center;color:var(--mu);padding:26px 14px;font-size:.9rem}

/* Animations Keyframes */
@keyframes slideDownFade { 0% { opacity: 0; transform: translateY(-30px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes slideUpFade { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }
.animate-card { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }

/* Responsive adjustments */
@media(max-width:760px){.nl{display:none}.hero{padding:36px 14px}nav{border-radius:24px; padding: 8px 12px;}}
.brand img{width:42px;height:42px}.hero img{width:120px;height:120px;filter:drop-shadow(0 0 28px rgba(255,214,10,.5))}
.ct svg{width:38px;height:38px;margin:0 auto 8px;display:block;color:var(--ac);stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr))}
.card{flex-direction:row;gap:14px}
.pi{flex:0 0 118px;height:118px;align-self:center;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pi img{max-width:100%;max-height:100%;object-fit:contain; transition: transform 0.4s ease;}
.card:hover .pi img{transform: scale(1.12);}
.cb{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
@media(max-width:420px){.pi{flex-basis:88px;height:88px}.card{padding:14px;gap:10px}}

/* ================= Shopping Cart CSS ================= */
#cart-fab { position:fixed; bottom:24px; right:24px; width:64px; height:64px; border-radius:50%; font-size:1.6rem; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:99; transition: transform 0.3s; border:1px solid var(--bd); background:var(--glass); color:var(--tx); box-shadow:var(--sh); }

#cart-badge { position:absolute; top:-4px; right:-4px; background:var(--ac); color:#111; font-size:0.85rem; font-weight:bold; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
@keyframes cartPulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); box-shadow: 0 0 20px var(--ac); } 100% { transform: scale(1); } }
#cart-fab.pulse { animation: cartPulse 1.5s infinite; border-color:var(--ac); }
#cart-fab:hover.pulse { animation: none; transform: scale(1.1); }

#cart-drawer { position:fixed; top:0; right:0; width:380px; max-width:100%; height:100vh; background:rgba(20,26,51,0.88); backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px); border-left:1px solid var(--bd); z-index:1000; transform:translateX(100%); transition:transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); display:flex; flex-direction:column; box-shadow:var(--sh); }
#cart-drawer.open { transform:translateX(0); }
body[dir="rtl"] #cart-drawer { right:auto; left:0; border-left:none; border-right:1px solid var(--bd); transform:translateX(-100%); }
body[dir="rtl"] #cart-drawer.open { transform:translateX(0); }

.cart-head { display:flex; justify-content:space-between; align-items:center; padding:20px; border-bottom:1px solid var(--bd); }
.cart-head h3 { margin:0; font-size:1.3rem; color:var(--tx); }
.cart-head button { background:transparent; border:none; color:var(--tx); font-size:1.8rem; cursor:pointer; transition: color 0.3s; }
.cart-head button:hover { color:var(--ac); }
#cart-items { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; }
.cart-item { display:flex; gap:12px; align-items:center; background:var(--glass); padding:12px; border-radius:14px; border:1px solid var(--bd); animation: slideUpFade 0.4s ease-out; }
.cart-item img { width:55px; height:55px; object-fit:contain; border-radius:10px; background:#fff; }
.cart-item-info { flex:1; }
.cart-item-info h4 { margin:0 0 6px; font-size:0.9rem; direction:ltr; text-align:start; color:var(--tx); }
.cart-item-info b { color:var(--ac); font-size:1.05rem; }
.cart-qty { display:flex; align-items:center; gap:10px; background:rgba(0,0,0,0.3); padding:5px 10px; border-radius:99px; }
.cart-qty button { background:transparent; border:none; color:var(--tx); cursor:pointer; font-weight:bold; font-size:1.2rem; }
.cart-foot { padding:24px; border-top:1px solid var(--bd); background:rgba(0,0,0,0.2); }
.cart-total { display:flex; justify-content:space-between; font-size:1.25rem; margin-bottom:18px; color:var(--tx); font-weight:bold; }
.cart-total b { color:var(--ac); }
#checkout-btn { width:100%; padding:15px; background:var(--ac); color:#111; border:none; border-radius:99px; font-weight:800; font-size:1.05rem; cursor:pointer; transition:transform 0.2s, box-shadow 0.2s; display:flex; align-items:center; justify-content:center; gap:8px;}
#checkout-btn:hover { transform:scale(1.03); box-shadow: 0 10px 20px rgba(255,214,10,0.2); }
#cart-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); z-index:999; opacity:0; pointer-events:none; transition:opacity 0.4s; }
#cart-overlay.show { opacity:1; pointer-events:auto; }
.cart-empty { text-align:center; color:var(--mu); margin-top:60px; font-size:1.1rem; }
</style>

function render(){
 var s=q.value.toLowerCase(),h="";
 var renderCount = 0;
 P.forEach(function(p,i){
  if(cat&&p[0]!=cat)return;
  if(s&&(p[1]+p[2]).toLowerCase().indexOf(s)<0)return;
  var pr=p[3]>0?"$"+p[3]:(p[3]<0?tr("out"):tr("call"));
  var btnState = p[3] < 0 ? 'disabled' : '';
  
  // لڤینا جوان (Animation Delay) ل سەر هەر کارتەکێ دهێتە ڕێکخستن
  var delay = (renderCount % 12) * 0.05;
  renderCount++;
  
  h+=`<div class="glass card animate-card" style="animation-delay:${delay}s">
        <div class="pi"><img loading="lazy" alt="${p[1]}" src="${src(IM[i])}"></div>
        <div class="cb">
            <span class="tag">${tr("c"+p[0])}</span>
            <h3>${p[1]}</h3>
            <div class="sp">${p[2]}</div>
            <div class="pr">
                <b${p[3]<=0?' style="font-size:1rem"':''}>${pr}</b>
                <button class="add-cart" onclick="addToCart(${i})" ${btnState}>${tr("ask")}</button>
            </div>
        </div>
      </div>`;
 });
 box.innerHTML=h;
}

/* ================= Shopping Cart Logic ================= */
var cart = {};

function toggleCart() {
    document.getElementById("cart-drawer").classList.toggle("open");
    document.getElementById("cart-overlay").classList.toggle("show");
}

function addToCart(idx) {
    if (P[idx][3] < 0) return; // Out of stock
    cart[idx] = (cart[idx] || 0) + 1;
    updateCart();
}

function changeQty(idx, delta) {
    if(!cart[idx]) return;
    cart[idx] += delta;
    if(cart[idx] <= 0) delete cart[idx];
    updateCart();
}

function updateCart() {
    var count = 0;
    var total = 0;
    var html = "";
    
    for(var idx in cart){
        var item = P[idx];
        var q = cart[idx];
        count += q;
        var price = item[3];
        var tPrice = price > 0 ? price * q : 0;
        total += tPrice;
        
        var priceText = price > 0 ? "$" + tPrice : tr("call");
        
        html += `<div class="cart-item">
                  <img src="${src(IM[idx])}" alt="">
                  <div class="cart-item-info">
                      <h4>${item[1]}</h4>
                      <b>${priceText}</b>
                  </div>
                  <div class="cart-qty">
                      <button onclick="changeQty(${idx}, -1)">-</button>
                      <span>${q}</span>
                      <button onclick="changeQty(${idx}, 1)">+</button>
                  </div>
                </div>`;
    }
    
    if(count === 0) {
        html = `<div class="cart-empty">${tr("cart_empty")}</div>`;
    }
    
    document.getElementById("cart-items").innerHTML = html;
    document.getElementById("cart-badge").innerText = count;
    document.getElementById("cart-sum").innerText = "$" + total;
    
    if(count > 0) {
        document.getElementById("cart-fab").classList.add("pulse");
    } else {
        document.getElementById("cart-fab").classList.remove("pulse");
    }
}

function checkout() {
    if(Object.keys(cart).length === 0) return;
    
    var txt = "سلاو، من ئەڤ بەرهەمە دڤێن:\n\n";
    if(lang === "ar") txt = "مرحباً، أود طلب المنتجات التالية:\n\n";
    if(lang === "en") txt = "Hello, I would like to order:\n\n";
    
    var total = 0;
    for(var i in cart){
        var item = P[i];
        var qty = cart[i];
        var price = item[3];
        var itemTotal = price > 0 ? price * qty : 0;
        total += itemTotal;
        var priceStr = price > 0 ? " ($"+itemTotal+")" : " ("+tr("call")+")";
        txt += "▪️ " + qty + "x " + item[1] + priceStr + "\n";
    }
    
    txt += "\n" + tr("cart_total") + " $" + total;
    
    window.open('https://wa.me/9647519433940?text=' + encodeURIComponent(txt), '_blank');
}
